version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: delivery_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin!211023
      POSTGRES_DB: delivery_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
